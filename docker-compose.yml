services:
  app:
    build: .
    container_name: app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - .:/app
    networks:
      - app-network
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 
              capabilities: [gpu]
    

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --url http://app:8000
    networks:
      - app-network
    depends_on:
      - app

  9router:
    image: 9router/9router:latest
    container_name: 9router
    ports:
      - "20128:20128"
    environment:
      - ROUTER_PORT=20128
    volumes:
      - ./9router_config.json:/app/9router.config.json
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data: 

